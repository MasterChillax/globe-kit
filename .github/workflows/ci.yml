name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" — passing `version` here too is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The gate must be able to fail: injected violations must be detected.
      - run: pnpm selftest
      # The root entry must bundle for the browser; the negative control (injected node:fs) must fail.
      - run: pnpm browser-check
      # No renderer dependency may ever enter this package: no maplibre-gl in dependencies, no import of it in src.
      # (Prose mentions in descriptions/comments are fine — the first version of this step matched those.)
      - run: |
          # The renderer is maplibre-gl itself; the pure @maplibre/maplibre-gl-style-spec validator is allowed as a dev dependency.
          node -e "const p=require('./package.json');const d=Object.keys({...p.dependencies,...p.devDependencies,...p.peerDependencies});if(d.some(n=>n==='maplibre-gl')){console.error('renderer dependency found:',d);process.exit(1)}"
          ! grep -rEq "from .maplibre-gl|require\(.maplibre-gl" src
